name: Relógio do YouTube

on:
  schedule:
    # a cada 6 horas — vídeo novo no canal entra no site sozinho
    - cron: '0 */6 * * *'
  workflow_dispatch:

# Onde as fotos moram (20/10/2026): o endereço público do bucket do R2. Hoje o
# de teste do Cloudflare; quando img.foyer.digital estiver no ar, muda aqui.
env:
  FOYER_CDN: https://pub-36dc382dfe4449bf89a3a04befb10c6c.r2.dev

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Buscar os episódios novos do canal
        id: yt
        run: |
          python3 tools/atualiza_youtube.py
          if git diff --quiet import/youtube.json; then
            echo "mudou=nao" >> "$GITHUB_OUTPUT"
            echo "Nenhum vídeo novo desde a última olhada."
          else
            echo "mudou=sim" >> "$GITHUB_OUTPUT"
          fi

      - name: Guardar o retrato novo do canal
        if: steps.yt.outputs.mudou == 'sim'
        run: |
          python3 tools/enciclopedia.py || true
          git config user.name "Relógio do YouTube (Foyer)"
          git config user.email "actions@github.com"
          git add import/youtube.json import/enciclopedia.json
          git commit -m "YouTube: episódios novos no site [skip ci]"
          git push

      # Sem a Pillow o site subia sem as miniaturas das fotos (auditoria de 10/10/2026)
      - name: Ferramentas de imagem (miniaturas das fotos e prévia de link das colunas)
        if: steps.yt.outputs.mudou == 'sim'
        run: pip install --quiet pillow boto3
      - name: Miniaturas guardadas da publicação anterior
        if: steps.yt.outputs.mudou == 'sim'
        uses: actions/cache@v4
        with:
          path: assets/thumbs
          key: thumbs-v1-${{ hashFiles('import/novas/**', 'import/materias.json', 'import/equipe.json', 'import/revista/edicoes/**') }}
          restore-keys: thumbs-v1-
      - name: Gerar o site com os episódios novos
        if: steps.yt.outputs.mudou == 'sim'
        run: python3 tools/build_pages.py


      - name: Fotos para o Cloudflare R2 (o site publicado só aponta para lá)
        # as chaves moram nos segredos do repositório; o endereço público em
        # FOYER_CDN, no env deste fluxo (20/10/2026)
        if: steps.yt.outputs.mudou == 'sim'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python3 tools/fotos_r2.py

      - uses: actions/configure-pages@v5
        if: steps.yt.outputs.mudou == 'sim'
      - name: Deixar fora do site publicado o que é só do repositório (fila, pautas, ferramentas, funções, manuais, senhas)
        # a lista do que sobe mora em .github/so-o-site.sh, a mesma nos três
        # fluxos que publicam (12/10/2026, auditoria achados 89 e 2)
        run: bash .github/so-o-site.sh
      - uses: actions/upload-pages-artifact@v3
        if: steps.yt.outputs.mudou == 'sim'
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
        if: steps.yt.outputs.mudou == 'sim'
