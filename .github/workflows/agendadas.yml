name: Relógio de matérias agendadas

on:
  schedule:
    - cron: '*/30 * * * *'
    # 00:02 em Brasília: a virada das temporadas de publicidade
    - cron: '2 3 * * *'
  workflow_dispatch:
  # O pêndulo do Supabase. O horário do GitHub acima é uma intenção, não uma
  # promessa: em 03/08/2026 ele ficou 2h43 sem rodar e segurou no ar uma
  # matéria marcada para as 9h10. O relógio do Supabase bate na hora, e de
  # dez em dez minutos manda este aviso. Quem decide se há algo vencido
  # continua sendo a etapa "verificar" logo abaixo.
  repository_dispatch:
    types: [relogio]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    outputs:
      publicar: ${{ steps.check.outputs.publicar }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        name: Alguma matéria agendada ou temporada de anúncio chegou na hora?
        run: |
          # ATENÇÃO: a saída deste script vai DIRETO para o $GITHUB_OUTPUT, que
          # só aceita linhas 'chave=valor'. Recado para o log (::notice::) tem de
          # sair pelo stderr, senão o interpretador rejeita o arquivo inteiro e o
          # job morre. Foi o que aconteceu em 31/07/2026, justamente na primeira
          # vez em que havia matéria para publicar: o erro só aparecia quando
          # devido=True, então passou despercebido em todas as rodadas vazias.
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, glob, sys
          from datetime import datetime, timezone, timedelta
          agora = datetime.now(timezone.utc)
          janela = (agora - timedelta(minutes=40)).isoformat()
          devido = False
          motivo = ''
          for f in glob.glob('import/novas/*.json'):
              try:
                  n = json.load(open(f))
              except Exception:
                  continue
              pub = n.get('publishAt') or ''
              if pub and janela < pub <= agora.isoformat():
                  devido, motivo = True, 'matéria agendada'
          # publicidade: a temporada é de dias cheios, no fuso de Brasília (UTC-3).
          # entra na virada do dia 'de' e sai depois do fim do dia 'ate'.
          br = agora - timedelta(hours=3)
          hoje = br.date().isoformat()
          ontem = (br.date() - timedelta(days=1)).isoformat()
          try:
              anun = json.load(open('import/anuncios/site.json'))
          except Exception:
              anun = {}
          for slot, cfg in (anun or {}).items():
              cfg = cfg or {}
              if not (cfg.get('img') or cfg.get('texto')):
                  continue
              if (cfg.get('de') or '') == hoje:
                  devido, motivo = True, f'estreia da temporada em {slot}'
              if (cfg.get('ate') or '') == ontem:
                  devido, motivo = True, f'fim da temporada em {slot}'
          if devido:
              print(f'::notice::Publicando: {motivo}', file=sys.stderr)
          print(f'publicar={"sim" if devido else "nao"}')
          EOF

  deploy:
    needs: verificar
    if: needs.verificar.outputs.publicar == 'sim'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Gerar o site com as matérias liberadas
        run: |
          python3 tools/atualiza_youtube.py || echo "YouTube fora do ar — usa o último retrato salvo"
          python3 tools/enciclopedia.py || echo "Enciclopédia: usa o último mapeamento salvo"
          python3 tools/build_pages.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
