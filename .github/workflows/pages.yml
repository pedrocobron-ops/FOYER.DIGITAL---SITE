name: Publicar no GitHub Pages

on:
  push:
    branches: [claude/foyer-digital-redesign-14l2b6]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Gerar o site (inclui matérias da Coxia já liberadas)
        run: |
          python3 tools/atualiza_youtube.py || echo "YouTube fora do ar — usa o último retrato salvo"
          python3 tools/enciclopedia.py || echo "Enciclopédia: usa o último mapeamento salvo"
          python3 tools/build_pages.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
