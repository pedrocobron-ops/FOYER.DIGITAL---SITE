name: Publicar no GitHub Pages

on:
  push:
    branches: [claude/foyer-digital-redesign-14l2b6]
  workflow_dispatch:

# Onde as fotos moram (20/10/2026): o endereço público do bucket do R2. Hoje o
# de teste do Cloudflare; quando img.foyer.digital estiver no ar, muda aqui.
env:
  FOYER_CDN: https://pub-36dc382dfe4449bf89a3a04befb10c6c.r2.dev

permissions:
  contents: read
  pages: write
  id-token: write

# A FILA DE PUBLICAÇÃO (corrigido em 06/08/2026).
# Estava `cancel-in-progress: true`: quando dois pushes vinham juntos — o que
# acontece toda vez que a Coxia sobe foto e matéria em segundos — o GitHub
# cancelava a publicação anterior NO MEIO. Mas a publicação já registrada
# continuava "em andamento" do outro lado, e a nova era recusada com
# "deployment in progress". Resultado: as duas morriam e a mudança não subia.
# Foi o que segurou a Agenda escondida por três tentativas seguidas.
# Com `false`, o pedido novo ESPERA a vez em vez de atropelar. Publicar duas
# vezes seguidas custa 40 segundos; perder a publicação custa o dia.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Ferramentas de imagem (miniaturas das fotos e prévia de link das colunas)
        run: pip install --quiet pillow boto3
      # As miniaturas (assets/thumbs/) ficam guardadas entre publicações: só o
      # que é foto nova é gerado de novo. A chave muda quando entra matéria.
      - name: Miniaturas guardadas da publicação anterior
        uses: actions/cache@v4
        with:
          path: assets/thumbs
          key: thumbs-v1-${{ hashFiles('import/novas/**', 'import/materias.json', 'import/equipe.json', 'import/revista/edicoes/**') }}
          restore-keys: thumbs-v1-
      - name: Gerar o site (inclui matérias da Coxia já liberadas)
        run: |
          python3 tools/atualiza_youtube.py || echo "YouTube fora do ar — usa o último retrato salvo"
          python3 tools/enciclopedia.py || echo "Enciclopédia: usa o último mapeamento salvo"
          python3 tools/build_pages.py
      - name: Fotos para o Cloudflare R2 (o site publicado só aponta para lá)
        # as chaves moram nos segredos do repositório; o endereço público em
        # FOYER_CDN, no env deste fluxo (20/10/2026)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python3 tools/fotos_r2.py
      - uses: actions/configure-pages@v5
      - name: Deixar fora do site publicado o que é só do repositório (fila, pautas, ferramentas, funções, manuais, senhas)
        # a lista do que sobe mora em .github/so-o-site.sh, a mesma nos três
        # fluxos que publicam (12/10/2026, auditoria achados 89 e 2)
        run: bash .github/so-o-site.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
